---
name: Release

on:
  push:
    branches:
      - master
      - develop
  pull_request:

permissions:
  contents: write
  pull-requests: write
  issues: write


jobs:

  lint-checks:
    name: Lint Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "latest"
          activate-environment: true

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Lint imports with Ruff
        run: ruff check . --select I

      - name: Lint with Ruff
        run: ruff check .

      - name: Lint Markdown files
        uses: DavidAnson/markdownlint-cli2-action@992badcdf24e3b8eb7e87ff9287fe931bcb00c6e
        with:
          config: '.markdownlint.json'
          globs: |
            README.md
            docs/**/*.md

  release:
    name: Release
    if: github.event_name == 'push' && github.ref != 'refs/heads/develop'
    needs: lint-checks
    runs-on: ubuntu-latest
    # Surface semantic-release outputs at the job level so the downstream
    # mcp-registry-publish job can gate on whether a release actually happened.
    outputs:
      new_release_published: ${{ steps.release.outputs.new_release_published }}
      new_release_version: ${{ steps.release.outputs.new_release_version }}
      new_release_notes: ${{ steps.release.outputs.new_release_notes }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "latest"
          activate-environment: true

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Import GPG key
        id: import_gpg
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.PASSPHRASE }}

      - name: Create release and publish
        id: release
        uses: cycjimmy/semantic-release-action@v2
        with:
          semantic_version: 17.1.1
          extra_plugins: |
            conventional-changelog-conventionalcommits@^4.4.0
            @semantic-release/git@^9.0.0
            @semantic-release/exec@^5.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}
          PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}

  # ---------------------------------------------------------------------------
  # MCP Registry Publish
  # ---------------------------------------------------------------------------
  # After every successful release, push the freshly-bumped server.json to
  # the canonical MCP Registry at https://registry.modelcontextprotocol.io
  # so downstream catalogs (GitHub MCP Registry, MCP-aware clients) see the
  # new version without manual intervention.
  #
  # Auth: GitHub OIDC — no PAT or long-lived token. The minimal permissions
  # block (id-token: write, contents: read) is scoped to this job only and
  # does not affect the rest of the workflow's permissions.
  #
  # Failure here is non-fatal for the release itself — PyPI / GitHub release
  # are already done by the time this job runs. Operators can fall back to
  # the manual `mcp-publisher publish` flow documented in
  # integrations/github/README.md.
  mcp-registry-publish:
    name: Publish to MCP Registry
    needs: release
    if: needs.release.outputs.new_release_published == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          # Check out the tag the release job just created so the published
          # server.json matches the version users see on PyPI / GitHub.
          ref: v${{ needs.release.outputs.new_release_version }}

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Authenticate to MCP Registry (GitHub OIDC)
        run: ./mcp-publisher login github-oidc

      - name: Publish server.json
        run: ./mcp-publisher publish

  # ---------------------------------------------------------------------------
  # MCPB Bundle Build, Sign & Attach
  # ---------------------------------------------------------------------------
  # After every successful release, build the cross-platform Claude Desktop
  # (.mcpb) bundle, sign it with the project's PGP key, and attach it to the
  # GitHub Release semantic-release just created.
  #
  # WHY THIS LIVES HERE (and not solely in mcpb-build.yml's release trigger):
  # GitHub deliberately suppresses workflow events raised by the built-in
  # GITHUB_TOKEN to prevent recursive runs. Because semantic-release publishes
  # the GitHub Release using GITHUB_TOKEN, the `release: published` event never
  # triggers a separate workflow. Chaining this job off the `release` job —
  # within the same workflow run — sidesteps that suppression entirely and
  # guarantees the bundle is attached automatically on every release.
  #
  # mcpb-build.yml still exists as a standalone workflow for manual
  # re-attachment (workflow_dispatch) and PR dry-runs; its build/sign logic is
  # intentionally mirrored here so the happy path needs no manual step.
  #
  # Gated on new_release_published so non-release pushes (and develop) are
  # skipped. Failure here is non-fatal for the release itself — PyPI / GitHub
  # release / MCP Registry are already done; operators can re-run via
  # `gh workflow run mcpb-build.yml -f tag=vX.Y.Z`.
  mcpb-bundle-attach:
    name: Build, sign & attach .mcpb
    needs: release
    if: needs.release.outputs.new_release_published == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write   # upload release assets
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          # Build from the exact tag the release job just created so the
          # bundle's version matches PyPI / GitHub / the MCP Registry.
          ref: v${{ needs.release.outputs.new_release_version }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "latest"
          activate-environment: true

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Set up Node (for mcpb pack via npx)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build the .mcpb bundle
        run: uv run python scripts/build_mcpb.py --output-dir dist

      - name: Import GPG key
        id: import_gpg
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.PASSPHRASE }}

      - name: Sign the bundle (detached PGP signature + SHA-256 checksum)
        env:
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}
          PASSPHRASE: ${{ secrets.PASSPHRASE }}
        run: |
          set -euo pipefail
          VERSIONED=$(ls dist/zscaler-mcp-server-*.mcpb | head -n1)
          echo "Signing $VERSIONED with key $GPG_FINGERPRINT"
          gpg --batch --yes --pinentry-mode loopback \
            --passphrase "$PASSPHRASE" \
            --local-user "$GPG_FINGERPRINT" \
            --detach-sign --armor \
            --output "${VERSIONED}.asc" \
            "$VERSIONED"
          ( cd dist && shasum -a 256 "$(basename "$VERSIONED")" > "$(basename "$VERSIONED").sha256" )
          gpg --verify "${VERSIONED}.asc" "$VERSIONED"
          ( cd dist && shasum -a 256 -c "$(basename "$VERSIONED").sha256" )
          echo "Signature and checksum verified."

      - name: Attach bundle + signature to the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="v${{ needs.release.outputs.new_release_version }}"
          VERSIONED=$(ls dist/zscaler-mcp-server-*.mcpb | head -n1)
          echo "Attaching $VERSIONED (+ .asc, .sha256) to release $TAG"
          gh release upload "$TAG" \
            "$VERSIONED" "${VERSIONED}.asc" "${VERSIONED}.sha256" \
            --clobber

      - name: Job summary
        run: |
          echo "## Claude Desktop (.mcpb) Bundle" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Release:** v${{ needs.release.outputs.new_release_version }}" >> "$GITHUB_STEP_SUMMARY"
          echo "**Signed with key:** ${{ steps.import_gpg.outputs.fingerprint }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          ls -lh dist/zscaler-mcp-server-*.mcpb dist/*.asc dist/*.sha256 >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # Docker Versioned Image Publish
  # ---------------------------------------------------------------------------
  # After every successful release, build the multi-platform Docker image from
  # the release tag and push the immutable + rolling semver tags
  # (X.Y.Z, X.Y, and X once the major version is > 0) to Docker Hub.
  #
  # WHY THIS LIVES HERE (and not in docker-build-push.yml's release trigger):
  # same GITHUB_TOKEN event-suppression as mcpb-bundle-attach above — the
  # `release: published` trigger in a standalone workflow never fires for
  # releases that semantic-release publishes with GITHUB_TOKEN. The semver tag
  # config that previously lived in docker-build-push.yml was dead code for
  # exactly that reason (no versioned tag was ever pushed). Chaining the build
  # off the `release` job sidesteps the suppression, mirroring PR #78.
  #
  # docker-build-push.yml still exists as a standalone workflow: it builds
  # `latest` on every master push and offers a workflow_dispatch path to
  # backfill versioned tags for an existing release.
  #
  # Failure here is non-fatal for the release itself — PyPI / GitHub release /
  # MCP Registry are already done; operators can backfill via
  # `gh workflow run docker-build-push.yml -f tag=vX.Y.Z`.
  docker-image-publish:
    name: Publish versioned Docker image
    needs: release
    if: needs.release.outputs.new_release_published == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write          # Required for provenance attestation signing
    steps:
      - name: Checkout release tag
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          # Build from the exact tag the release job just created so the
          # image's version matches PyPI / GitHub / the MCPB bundle.
          ref: v${{ needs.release.outputs.new_release_version }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435

      - name: Log in to Docker Hub
        uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Derive rolling version tags
        id: ver
        run: |
          set -euo pipefail
          VERSION="${{ needs.release.outputs.new_release_version }}"
          MAJOR="${VERSION%%.*}"
          REST="${VERSION#*.}"
          MINOR="${REST%%.*}"
          {
            echo "version=${VERSION}"
            echo "major_minor=${MAJOR}.${MINOR}"
            echo "major=${MAJOR}"
          } >> "$GITHUB_OUTPUT"

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c1e51972afc2121e065aed6d45c65596fe445f3f
        with:
          images: zscaler/zscaler-mcp-server
          tags: |
            type=raw,value=${{ steps.ver.outputs.version }}
            type=raw,value=${{ steps.ver.outputs.major_minor }}
            type=raw,value=${{ steps.ver.outputs.major }},enable=${{ steps.ver.outputs.major != '0' }}
          flavor: |
            latest=false
          labels: |
            org.opencontainers.image.title=Zscaler Integrations MCP Server
            org.opencontainers.image.description=Model Context Protocol server for Zscaler API
            org.opencontainers.image.vendor=Zscaler
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.source=https://github.com/zscaler/zscaler-mcp-server
            org.opencontainers.image.documentation=https://github.com/zscaler/zscaler-mcp-server/blob/main/README.md

      - name: Build and push Docker image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          sbom: true
          provenance: mode=max

      - name: Job summary
        run: |
          echo "## 🐳 Versioned Docker Image Published" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Release:** v${{ needs.release.outputs.new_release_version }}" >> "$GITHUB_STEP_SUMMARY"
          echo "**Registry:** docker.io/zscaler/zscaler-mcp-server" >> "$GITHUB_STEP_SUMMARY"
          echo "**Tags:**" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.meta.outputs.tags }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Platforms:** linux/amd64, linux/arm64" >> "$GITHUB_STEP_SUMMARY"
          echo "**Attestations:** SBOM + Provenance (max)" >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # ECR Build & AWS Marketplace Publish
  # ---------------------------------------------------------------------------
  # AWS Marketplace ships an ARM64-only image from Marketplace's own registry
  # (709825985650), so it cannot reuse the Docker Hub job above: different
  # registry, single architecture, and no attestation manifests (Marketplace
  # scanning rejects them).
  #
  # Chained off the `release` job rather than triggered by `release: published`,
  # for the same GITHUB_TOKEN event-suppression reason as mcpb-bundle-attach and
  # docker-image-publish above (PR #78).
  #
  # ecr-build-push.yml mirrors these steps as a workflow_dispatch fallback for
  # re-running a failed push or re-submitting listing content.
  #
  # Requires GitHub Environment `aws-marketplace` carrying AWS_ROLE_ARN,
  # AWS_REGION, ECR_REPOSITORY and AWS_MARKETPLACE_PRODUCT_ID. The OIDC role's
  # trust policy must name THIS repository, not the retired AWS fork.
  ecr-publish:
    name: ECR Build & Marketplace Publish
    needs: release
    if: needs.release.outputs.new_release_published == 'true'
    runs-on: ubuntu-latest
    environment: aws-marketplace
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout release tag
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          # Build the exact tag the release job just created, so the Marketplace
          # image matches PyPI / Docker Hub / the MCPB bundle.
          ref: v${{ needs.release.outputs.new_release_version }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@ececac1a45f3b08a01d2dd070d28d111c5fe6722
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@062b18b96a7aff071d4dc91bc00c4c1a7945b076
        with:
          registries: "709825985650"

      - name: Compute image tag
        id: image-tag
        env:
          RAW_VERSION: ${{ needs.release.outputs.new_release_version }}
        run: |
          VERSION="${RAW_VERSION#v}"
          echo "tag=${VERSION}-bedrock" >> $GITHUB_OUTPUT
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c1e51972afc2121e065aed6d45c65596fe445f3f
        with:
          images: 709825985650.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/${{ secrets.ECR_REPOSITORY }}
          tags: |
            type=raw,value=${{ steps.image-tag.outputs.tag }}
          flavor: |
            latest=false
          labels: |
            org.opencontainers.image.title=Zscaler Integrations MCP Server
            org.opencontainers.image.description=Model Context Protocol server for the Zscaler Zero Trust Exchange
            org.opencontainers.image.vendor=Zscaler
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.source=https://github.com/zscaler/zscaler-mcp-server

      - name: Build and push to ECR
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83
        with:
          context: .
          # AgentCore runs on Graviton. Marketplace scanning also rejects the
          # OCI attestation manifests buildx attaches by default, hence
          # provenance: false — unlike the Docker Hub job, which keeps them.
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Submit version to AWS Marketplace
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
          PRODUCT_ID: ${{ secrets.AWS_MARKETPLACE_PRODUCT_ID }}
          IMAGE_TAG: ${{ steps.image-tag.outputs.tag }}
          VERSION: ${{ steps.image-tag.outputs.version }}
          # Read through the environment, never interpolated into the script
          # body: these notes are generated from commit messages and may contain
          # shell metacharacters.
          INPUT_RELEASE_NOTES: ${{ needs.release.outputs.new_release_notes }}
        run: |
          ECR_REGISTRY="709825985650.dkr.ecr.${AWS_REGION}.amazonaws.com"
          IMAGE_URI="${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"
          VERSION_TITLE="${IMAGE_TAG}"

          RELEASE_NOTES="${INPUT_RELEASE_NOTES}"
          if [ -z "$RELEASE_NOTES" ]; then
            RELEASE_NOTES="Zscaler MCP Server ${VERSION} for Amazon Bedrock AgentCore."
          fi

          RELEASE_NOTES_JSON=$(printf '%s' "$RELEASE_NOTES" | head -c 4000 | python3 -c "import sys,json; print(json.dumps(sys.stdin.read().strip()))")

          cat > /tmp/changeset.json <<EOF
          {
            "Catalog": "AWSMarketplace",
            "ChangeSet": [
              {
                "ChangeType": "AddDeliveryOptions",
                "Entity": {
                  "Identifier": "${PRODUCT_ID}",
                  "Type": "ContainerProduct@1.0"
                },
                "DetailsDocument": {
                  "Version": {
                    "VersionTitle": "${VERSION_TITLE}",
                    "ReleaseNotes": ${RELEASE_NOTES_JSON}
                  },
                  "DeliveryOptions": [
                    {
                      "DeliveryOptionTitle": "Amazon Bedrock AgentCore",
                      "Details": {
                        "EcrDeliveryOptionDetails": {
                          "ContainerImages": ["${IMAGE_URI}"],
                          "CompatibleServices": ["Bedrock-AgentCore"],
                          "AgenticType": ["MCP_SERVER"],
                          "Description": "Deploy the Zscaler Integrations MCP Server as an MCP tool inside Amazon Bedrock AgentCore. Provides 254 read-only tools across ten Zscaler services (ZIA, ZPA, ZDX, ZCC, ZTW, ZIdentity, EASM, Z-Insights, ZMS, ZCell), plus 148 write tools that are available only behind an explicit allowlist. Includes MCP client authentication (OIDC, JWT, API key, Zscaler OneAPI), source IP ACL, human confirmation on every destructive operation, output sanitization and audit logging.",
                          "UsageInstructions": "# Amazon Bedrock AgentCore Deployment\n\n## Prerequisites\n\n1. Zscaler OneAPI credentials from the ZIdentity console\n2. An AgentCore execution role with ECR pull and CloudWatch Logs permissions\n\n## Required credentials\n\n- ZSCALER_CLIENT_ID: OneAPI client ID\n- ZSCALER_CLIENT_SECRET: OneAPI client secret\n- ZSCALER_VANITY_DOMAIN: ZIdentity vanity domain (e.g. mycompany.zsapi.net)\n- ZSCALER_CUSTOMER_ID: customer ID, required for ZPA tools\n\nAlternatively hold them in AWS Secrets Manager: set ZSCALER_SECRET_NAME to the\nsecret name and grant the execution role secretsmanager:GetSecretValue. The\nserver loads them at startup.\n\n## Transport (required)\n\nThe image defaults to the stdio transport on 127.0.0.1, which AgentCore cannot\nreach. You MUST set:\n\n- ZSCALER_MCP_TRANSPORT=streamable-http\n- ZSCALER_MCP_HOST=0.0.0.0\n\nZSCALER_MCP_PORT already defaults to 8000 and can be left unset.\n\n## Protocol revision\n\nAgentCore replaces the session identifier the server issues, so clients that\nperform the older initialize handshake cannot complete it. Use a client that\nnegotiates MCP revision 2026-07-28, which is self-contained per request. The\ndeployment guide below includes a boto3 example.\n\n## Authentication\n\nAgentCore authenticates every caller itself, by IAM SigV4 or a JWT authorizer,\nand those requests carry no credentials of their own. Set\nZSCALER_MCP_TRUST_PLATFORM_AUTH=true so the server accepts them on the\nplatform's authentication. It applies only to the api-key and zscaler modes,\nand should only ever be enabled behind a platform that authenticates callers.\n\nZSCALER_MCP_AUTH_MODE accepts jwt, api-key, zscaler or oidc. Left unset, the\nmode is auto-detected from whichever settings are present.\n\n## Write operations\n\nWrite tools are off by default. Enabling them requires BOTH\nZSCALER_MCP_WRITE_ENABLED=true AND ZSCALER_MCP_WRITE_TOOLS naming the permitted\npatterns. Neither setting enables anything on its own, and an empty allowlist\npermits nothing. Deletes always require a confirmation that cannot be switched\noff.\n\n## Full guide\n\nhttps://github.com/zscaler/zscaler-mcp-server/blob/master/docs/deployment/amazon_bedrock_agentcore.md",
                          "EnvironmentVariables": [
                            {"Name": "ZSCALER_CLIENT_ID", "Description": "Zscaler OneAPI client ID from the ZIdentity console."},
                            {"Name": "ZSCALER_CLIENT_SECRET", "Description": "Zscaler OneAPI client secret from the ZIdentity console."},
                            {"Name": "ZSCALER_VANITY_DOMAIN", "Description": "ZIdentity vanity domain (e.g. mycompany.zsapi.net)."},
                            {"Name": "ZSCALER_CUSTOMER_ID", "Description": "Zscaler customer ID; required when calling ZPA tools."},
                            {"Name": "ZSCALER_SECRET_NAME", "Description": "AWS Secrets Manager secret holding the credentials above. Set this instead of passing them directly."},
                            {"Name": "ZSCALER_MCP_TRANSPORT", "Description": "Transport mode. AgentCore requires streamable-http; the image otherwise defaults to stdio.", "DefaultValue": "streamable-http"},
                            {"Name": "ZSCALER_MCP_HOST", "Description": "Bind address. AgentCore requires 0.0.0.0; the image otherwise defaults to 127.0.0.1.", "DefaultValue": "0.0.0.0"},
                            {"Name": "ZSCALER_MCP_PORT", "Description": "Listen port for the HTTP transport.", "DefaultValue": "8000"},
                            {"Name": "ZSCALER_MCP_AUTH_ENABLED", "Description": "Enable MCP client authentication. Enabled unless explicitly set to false.", "DefaultValue": "true"},
                            {"Name": "ZSCALER_MCP_AUTH_MODE", "Description": "Authentication mode: jwt, api-key, zscaler or oidc. Auto-detected when unset."},
                            {"Name": "ZSCALER_MCP_TRUST_PLATFORM_AUTH", "Description": "Accept requests carrying no credentials of their own, on AgentCore's authentication. Applies to the api-key and zscaler modes. Only safe behind a platform that authenticates every caller.", "DefaultValue": "false"},
                            {"Name": "ZSCALER_MCP_WRITE_ENABLED", "Description": "Master switch for write tools. Has no effect unless ZSCALER_MCP_WRITE_TOOLS is also set.", "DefaultValue": "false"},
                            {"Name": "ZSCALER_MCP_WRITE_TOOLS", "Description": "Allowlist of write tools to permit (e.g. zpa_create_*,zia_update_*). Required alongside ZSCALER_MCP_WRITE_ENABLED; an empty value permits nothing."},
                            {"Name": "ZSCALER_MCP_REQUEST_STATE_KEYS", "Description": "Shared key ring for pending delete confirmations. Required when running more than one replica with write tools enabled."},
                            {"Name": "ZSCALER_MCP_TOOLSETS", "Description": "Comma-separated toolsets to load (e.g. zia_url_filtering,zpa_app_segments). Accepts 'default' or 'all'."},
                            {"Name": "ZSCALER_MCP_DISABLED_TOOLSETS", "Description": "Comma-separated toolsets to exclude. Wins over ZSCALER_MCP_TOOLSETS."},
                            {"Name": "ZSCALER_MCP_DISABLED_SERVICES", "Description": "Comma-separated services to disable (e.g. zcc,zdx)."},
                            {"Name": "ZSCALER_MCP_DISABLED_TOOLS", "Description": "Comma-separated tool patterns to exclude (e.g. zcc_*)."},
                            {"Name": "ZSCALER_MCP_ALLOWED_SOURCE_IPS", "Description": "Comma-separated client IPs/CIDRs allowed to connect."},
                            {"Name": "ZSCALER_MCP_LOG_TOOL_CALLS", "Description": "Log every tool invocation for audit.", "DefaultValue": "false"}
                          ]
                        }
                      }
                    }
                  ]
                }
              }
            ]
          }
          EOF

          python3 -c "import json; json.load(open('/tmp/changeset.json'))" || {
            echo "::error::Generated changeset JSON is invalid"
            exit 1
          }

          echo "Submitting version ${VERSION_TITLE} to AWS Marketplace..."
          RESULT=$(aws marketplace-catalog start-change-set \
            --region us-east-1 \
            --cli-input-json file:///tmp/changeset.json 2>&1) || true

          if echo "$RESULT" | grep -q "ChangeSetId"; then
            CHANGESET_ID=$(echo "$RESULT" | python3 -c "import sys,json; print(json.loads(sys.stdin.read())['ChangeSetId'])")
            echo "AWS Marketplace version submitted. ChangeSet ID: ${CHANGESET_ID}"
            echo "MARKETPLACE_CHANGESET_ID=${CHANGESET_ID}" >> $GITHUB_ENV
          else
            echo "::warning::AWS Marketplace submission failed: ${RESULT}"
            echo "Manual submission may be required via the AWS Marketplace Management Portal."
          fi

      - name: Generate summary
        if: always()
        run: |
          TAGS="${{ steps.meta.outputs.tags }}"
          FULL_TAG=$(echo "$TAGS" | head -n1)
          TAG_ONLY=$(echo "$FULL_TAG" | sed 's/.*://')

          echo "## ECR Image Published" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${{ steps.image-tag.outputs.tag }}" >> $GITHUB_STEP_SUMMARY
          echo "**Registry:** 709825985650.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/${{ secrets.ECR_REPOSITORY }}" >> $GITHUB_STEP_SUMMARY
          echo "**Tags:**" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "$TAGS" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Platform:** linux/arm64 (AWS Graviton)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Pull Command:**" >> $GITHUB_STEP_SUMMARY
          echo '```bash' >> $GITHUB_STEP_SUMMARY
          echo "docker pull 709825985650.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/${{ secrets.ECR_REPOSITORY }}:${TAG_ONLY}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

          if [ -n "${MARKETPLACE_CHANGESET_ID:-}" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "## AWS Marketplace" >> $GITHUB_STEP_SUMMARY
            echo "**Version:** ${{ steps.image-tag.outputs.tag }}" >> $GITHUB_STEP_SUMMARY
            echo "**ChangeSet ID:** ${MARKETPLACE_CHANGESET_ID}" >> $GITHUB_STEP_SUMMARY
            echo "**Status:** Submitted (check [Marketplace Portal](https://aws.amazon.com/marketplace/management/requests))" >> $GITHUB_STEP_SUMMARY
          fi
